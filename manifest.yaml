app_name: swift-deploy
app_version: 1.0.0
logging:
  driver: json-file
  options:
    max-file: '3'
    max-size: 10m
network:
  driver_type: bridge
  name: swiftdeploy-net
nginx:
  error_responses:
  - code: 502
    contact: devops@example.com
    message: Bad Gateway
    service: upstream
  - code: 503
    contact: devops@example.com
    message: Service Unavailable
    service: api
  - code: 504
    contact: devops@example.com
    message: Gateway Timeout
    service: upstream
  image: nginx:latest
  port: 8080
  proxy_connect_timeout: 30
  proxy_read_timeout: 30
  proxy_timeout: 30
security:
  capabilities_add:
  - NET_BIND_SERVICE
  capabilities_drop:
  - ALL
  non_root_user: appuser
services:
  healthcheck:
    endpoint: /healthz
    interval: 10
    retries: 3
    timeout: 5
  image: swift-deploy-1-node:latest
  mode: canary
  name: api
  port: 3000
version: '1.0'
volumes:
  logs:
    driver: local
policies:
  enabled: true
  directory: ./policies
  opa_image: openpolicyagent/opa:latest
  opa_port: 8181
  checks:
    pre_deploy: true
    pre_promote: true
